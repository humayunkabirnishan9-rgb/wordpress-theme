    <circle cx="82" cy="65" r="38" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="82" cy="55" r="16" fill="#D4A373"/>
    <path d="M66 85 C66 73 98 73 98 85 Z" fill="#334155"/>
    <!-- Text -->
    <text x="82" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Technical Pod</text>
    <text x="82" y="146" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#93C5FD">CRAWL &amp; CORE WEB VITALS</text>
    <rect x="22" y="162" width="121" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="82" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Server Log Forensics</text>
    <text x="82" y="196" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Canonical Remediation</text>
    <text x="82" y="212" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">DOM Hydration &amp; CWV</text>
  </g>

