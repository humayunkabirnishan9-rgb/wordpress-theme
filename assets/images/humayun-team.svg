  <g transform="translate(410, 170)" filter="url(#card-shadow)">
    <rect width="165" height="235" rx="14" fill="#0F172A" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="82" cy="65" r="38" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="82" cy="55" r="16" fill="#E2B184"/>
    <path d="M66 85 C66 73 98 73 98 85 Z" fill="#1E3A8A"/>
    <!-- Text -->
    <text x="82" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Semantic Pod</text>
    <text x="82" y="146" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#93C5FD">SCHEMA &amp; ENTITIES</text>
    <rect x="22" y="162" width="121" height="1" fill="rgba(255,255,255,0.1)"/>
    <text x="82" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">JSON-LD Graph Modeling</text>
    <text x="82" y="196" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Topical Cluster Silos</text>
    <text x="82" y="212" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">AI Overview Optimization</text>
  </g>

